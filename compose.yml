name: accesspolicy
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: accesspolicy
      POSTGRES_USER: accesspolicy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/Init.ps1}
    ports:
      - "127.0.0.1:5458:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesspolicy -d accesspolicy"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m
  api:
    build:
      context: .
      target: runtime
    image: accesspolicy-api:local
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: accesspolicy
      DB_USERNAME: accesspolicy
    command: ["sh", "-c", "php artisan migrate --force && php artisan db:seed --force && exec php -S 0.0.0.0:8000 -t public public/index.php"]
    ports:
      - "127.0.0.1:8102:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "scripts/health.php"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
      - /app/storage:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 384m
volumes:
  pgdata:
